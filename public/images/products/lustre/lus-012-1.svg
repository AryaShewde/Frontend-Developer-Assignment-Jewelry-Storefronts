<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
    <rect width="400" height="400" fill="#fdf6e3"/>
    <!-- Subtle inner vignette frame -->
    <rect x="12" y="12" width="376" height="376" rx="8" fill="none" stroke="#e2e8f0" stroke-opacity="0.15" stroke-width="1"/>
    
      <defs>
        <radialGradient id="earringGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
          <stop offset="60%" stop-color="#f1f5f9" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.3"/>
        </radialGradient>
        <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e2e8f0"/>
          <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#94a3b8"/>
        </linearGradient>
      </defs>

      <!-- Left Earring -->
      <g transform="translate(140, 200)">
        <circle cx="0" cy="0" r="42" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="2"/>
        <polygon points="0,-36 25,-15 25,15 0,36 -25,15 -25,-15" fill="url(#earringGlow)" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="14" fill="#ffffff" opacity="0.8"/>
        <!-- sparkle -->
        <path d="M0,-24 L3,-6 L21,0 L3,6 L0,24 L-3,6 L-21,0 L-3,-6 Z" fill="#38bdf8" opacity="0.65"/>
      </g>

      <!-- Right Earring -->
      <g transform="translate(260, 200)">
        <circle cx="0" cy="0" r="42" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="2"/>
        <polygon points="0,-36 25,-15 25,15 0,36 -25,15 -25,-15" fill="url(#earringGlow)" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="14" fill="#ffffff" opacity="0.8"/>
        <!-- sparkle -->
        <path d="M0,-24 L3,-6 L21,0 L3,6 L0,24 L-3,6 L-21,0 L-3,-6 Z" fill="#38bdf8" opacity="0.65"/>
      </g>
    
  </svg>